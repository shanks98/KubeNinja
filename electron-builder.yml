appId: app.kubeninja.desktop
productName: KubeNinja
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
win:
  target:
    - nsis
    - portable
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
# Unsigned dev builds for now; code-signing + notarization + autoupdate come later.
npmRebuild: true
publish: []
