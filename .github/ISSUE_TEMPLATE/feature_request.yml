name: ✨ Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like KubeNinja to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or how you work around this now.
  - type: checkboxes
    id: security
    attributes:
      label: Security model
      description: KubeNinja keeps credentials in memory only and never on disk.
      options:
        - label: My idea preserves that (or I've noted where it might not).
