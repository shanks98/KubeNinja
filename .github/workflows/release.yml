name: Release

on:
  push:
    tags: ['v*']          # tag a release (e.g. v0.3.0) to build + publish installers
  workflow_dispatch: {}   # or run manually to smoke-test the build (no publish)

permissions:
  contents: write         # create / upload GitHub Releases

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Helm binaries
        run: node scripts/fetch-helm.mjs

      - name: Make Helm binaries executable (unix)
        if: runner.os != 'Windows'
        run: chmod +x resources/bin/helm-linux-* resources/bin/helm-darwin-* || true

      - name: Generate app icon
        run: node scripts/gen-icon.mjs

      - name: Build (main + preload + renderer)
        run: npm run build

      - name: Package installers
        # Publish to a GitHub Release only for tag builds; otherwise just build.
        run: npx --no-install electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: KubeNinja-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
